databases:
  - name: ems-db
    databaseName: ems
    user: ems_user
    plan: free

services:
  - type: web
    name: ems-web
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn ems.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ems-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: RENDER_EXTERNAL_HOSTNAME
        sync: false
